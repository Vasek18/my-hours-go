# Rendered at container start from /etc/nginx/templates by the nginx image.
# ${PORT} and ${API_UPSTREAM} come from the environment (see Dockerfile / Railway).
server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API so the browser only ever sees one origin.
    # Note: ${API_UPSTREAM} must be resolvable when nginx starts. On Railway,
    # point it at the API service's private hostname (e.g. api.railway.internal:8080).
    location /api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
