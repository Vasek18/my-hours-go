version: "2"
sql:
  - engine: "postgresql"
    # Schema is the migrations dir; sqlc understands golang-migrate naming and
    # ignores *.down.sql automatically.
    schema: "internal/db/migrations"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        # Map Postgres types to clean Go types so structs are IDE-friendly and
        # JSON-serializable without pgtype wrappers.
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          # Nullable uuid columns (e.g. activities.type_id) map to NullUUID so
          # handlers can distinguish "no value" from the zero UUID.
          - db_type: "uuid"
            nullable: true
            go_type: "github.com/google/uuid.NullUUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"
