name: Release

# Tag releases as vX.Y.Z. Both images are always built and pushed together,
# tagged with the release tag and moved to `latest`, and the chart's version
# metadata is bumped to match via an auto-opened PR.

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.event.release.tag_name }}
          tags: |
            ghcr.io/vasek18/my-hours-backend:${{ github.event.release.tag_name }}
            ghcr.io/vasek18/my-hours-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/vasek18/my-hours-frontend:${{ github.event.release.tag_name }}
            ghcr.io/vasek18/my-hours-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  bump-chart-version:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AV_HELPER_BOT_APP_ID }}
          private-key: ${{ secrets.AV_HELPER_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Compute chart version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Bump Chart.yaml version/appVersion
        id: bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          FILES="charts/my-hours/Chart.yaml charts/my-hours/charts/backend/Chart.yaml charts/my-hours/charts/frontend/Chart.yaml"
          # version: must be valid SemVer (no "v" prefix) for Helm's own tooling.
          sed -i "s/^version: .*/version: ${VERSION}/" $FILES
          # appVersion: has no such constraint and should match the actual
          # pushed image tags (ghcr.io/.../my-hours-{backend,frontend}:${RELEASE_TAG}),
          # which keep the release's "v" prefix — so the chart's default
          # image.tag fallback (.Chart.AppVersion) resolves to a real tag.
          sed -i "s/^appVersion: .*/appVersion: \"${RELEASE_TAG}\"/" $FILES

          git add $FILES
          if git diff --cached --quiet; then
            echo "Chart is already at version ${VERSION}, nothing to bump"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity as the app bot
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          BOT_USER_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Commit and push chart bump
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BRANCH="chart-bump/${VERSION}"
          git checkout -b "$BRANCH"
          git commit -m "chore: bump chart version to ${VERSION}"
          git push --force origin "$BRANCH"

      - name: Open chart version bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          BRANCH="chart-bump/${VERSION}"
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR for $BRANCH already exists, skipping create"
          else
            gh pr create \
              --title "chore: bump chart version to ${VERSION}" \
              --body "Automated version bump following release \`${RELEASE_TAG}\`." \
              --base main \
              --head "$BRANCH"
          fi

      - name: Approve and auto-merge PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BRANCH="chart-bump/${VERSION}"
          gh pr review "$BRANCH" --approve
          gh pr merge "$BRANCH" --auto --squash --delete-branch
