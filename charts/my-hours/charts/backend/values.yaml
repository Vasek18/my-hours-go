replicaCount: 1

image:
  repository: ghcr.io/vasek18/my-hours-backend
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

env:
  appEnv: production
  # Must be set to your real public URL — used to build password-reset and
  # email-change confirmation links. The chart fails to render if left empty.
  appUrl: ""
  redisAddr: redis:6379

# Names of pre-existing Secrets (created outside this chart) holding each
# env var's value — e.g. point databaseSecretName at a database operator's
# own generated credentials Secret, and sessionSecretName at a separately
# managed one. Both required — the chart fails to render if either is unset.
databaseSecretName: ""
# Key within databaseSecretName holding the connection string — configurable
# since operator-generated Secrets don't all use the same key name (e.g.
# CloudNativePG's autogenerated Secret uses "uri", not "DATABASE_URL").
databaseSecretKey: DATABASE_URL
sessionSecretName: ""

# Shared with the frontend subchart: the frontend's default API_UPSTREAM
# (<fullname>:<port>) is computed from these same values, so overriding the
# backend's name/port here keeps the frontend's default in sync automatically.
global:
  backend:
    nameOverride: ""
    fullnameOverride: ""
    port: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
