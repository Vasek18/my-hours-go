global:
  backend:
    nameOverride: ""
    fullnameOverride: ""
    port: 8080

backend:
  image:
    repository: ghcr.io/vasek18/my-hours-backend
    tag: ""
  replicaCount: 1
  imagePullSecrets: []
  env:
    appEnv: production
    appUrl: ""
    redisAddr: redis:6379
  existingSecret: ""
  databaseSecretName: ""
  sessionSecretName: ""
  secretKeys:
    databaseUrl: DATABASE_URL
    sessionSecret: SESSION_SECRET
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

frontend:
  image:
    repository: ghcr.io/vasek18/my-hours-frontend
    tag: ""
  replicaCount: 1
  imagePullSecrets: []
  apiUpstream: ""
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 64Mi
